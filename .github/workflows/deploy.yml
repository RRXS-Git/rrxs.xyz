name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Debug env
        run: |
          echo "Python: $(python3 --version 2>/dev/null || echo NONE)"
          echo "jq: $(jq --version 2>/dev/null || echo NONE)"
          echo "PWD: $(pwd)"
          echo "Has TOKEN: $([ -n \"${CF_API_TOKEN}\" ] && echo YES || echo NO)"
          echo "Has ACCT: $([ -n \"${CF_ACCOUNT_ID}\" ] && echo YES || echo NO)"

      - name: Ensure production_branch=main
        run: |
          set +e
          curl -s -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz" | \
            jq -c '{success, errors}'

      - name: Deploy to rrxs-xyz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Migrate custom domain rrxs.xyz (wrangler)
        run: |
          set -e
          LOG=/tmp/domain-migration.log
          exec > >(tee -a "$LOG") 2>&1

          echo "=== Step 1: Wrangler version ==="
          npx wrangler --version

          echo ""
          echo "=== Step 2: Add custom domain via wrangler ==="
          echo "Running: npx wrangler pages domain add rrxs.xyz --project-name=rrxs-xyz"
          npx wrangler pages domain add rrxs.xyz --project-name=rrxs-xyz || true

          echo ""
          echo "=== Step 3: Check existing custom domains ==="
          npx wrangler pages domain list --project-name=rrxs-xyz || echo "domain list not available"

          echo ""
          echo "=== Step 4: Verify project details ==="
          npx wrangler pages project list --json 2>/dev/null | python3 -c "import sys,json;[print(f'{p[\"name\"]} -> domains: {p.get(\"domains\",[])}') for p in json.load(sys.stdin)]" || echo "Project list not available"

      - name: Upload migration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-migration-logs
          path: /tmp/domain-migration.log
          retention-days: 1

      - name: Verify
        run: |
          set +e
          echo "=== rrxs.xyz ==="
          curl -sI "https://rrxs.xyz/" | head -3
          echo ""
          echo "=== pages.dev ==="
          curl -sI "https://rrxs-xyz.pages.dev/" | head -3
          echo ""
          echo "=== Body compare ==="
          echo "rrxs.xyz body size: $(curl -s 'https://rrxs.xyz/' | wc -c)"
          echo "pages.dev body size: $(curl -s 'https://rrxs-xyz.pages.dev/' | wc -c)"
