name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        id: wrangler
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Ensure production_branch=main
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz"
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"
          CT="Content-Type: application/json"

          echo "::group::1. Check current production_branch"
          PROJECT=$(curl -s -H "$AUTH" "$API")
          CURRENT=$(echo "$PROJECT" | jq -r '.result.production_branch // "none"')
          echo "Current production_branch: $CURRENT"
          if [ "$CURRENT" != "main" ]; then
            echo "Setting production_branch to main..."
            RESULT=$(curl -s -X PATCH -H "$AUTH" -H "$CT" -d '{"production_branch":"main"}' "$API")
            echo "$RESULT" | jq -c '{success: .success, errors: .errors}'
          else
            echo "Already main - all good"
          fi
          echo "::endgroup::"

          echo "::group::2. Verify final project state"
          curl -s -H "$AUTH" "$API" | jq '{production_branch: .result.production_branch}'
          echo "::endgroup::"
