name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Set production_branch=main
        run: |
          set +e
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz"
          echo "=== PATCH production_branch ==="
          curl -s -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' "$API" | \
            python3 -c "import sys, json; d = json.load(sys.stdin); print(json.dumps({'ok': d.get('success')}))"

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Attach custom domain rrxs.xyz
        run: |
          set +e
          echo "=== Add rrxs.xyz domain ==="
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz/domains"
          curl -s -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"name":"rrxs.xyz"}' "$API" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(json.dumps({'ok':d.get('success'),'r':str(d.get('result'))}, default=str))"

      - name: Verify final state
        run: |
          set +e
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz"
          echo "=== Project state ==="
          curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" "$API" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); r=d.get('result',{}); print(json.dumps({'production_branch':r.get('production_branch'),'canonical':r.get('canonical_deployment',{}).get('created_on'),'latest':r.get('latest_deployment',{}).get('created_on')}))"
          echo "=== Domains ==="
          curl -s -H "Authorization: Bearer ${CF_API_TOKEN}" "${API}/domains" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); [print(f'  {x[\"name\"]} status={x[\"status\"]}') for x in (d.get('result') or [])]"
