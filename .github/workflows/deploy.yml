name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Debug env
        run: |
          echo "Python: $(python3 --version)"
          echo "PWD: $(pwd)"
          echo "Has API TOKEN: $([ -n \"${CF_API_TOKEN}\" ] && echo YES || echo NO)"
          echo "Has ACCOUNT ID: $([ -n \"${CF_ACCOUNT_ID}\" ] && echo YES || echo NO)"

      - name: Ensure production_branch=main
        run: |
          set +e
          curl -s -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz" | \
            python3 -c "import sys,json; print('PATCH:', json.load(sys.stdin).get('success'))"

      - name: Deploy to rrxs-xyz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Migrate custom domain rrxs.xyz
        run: |
          set +e
          echo "--- Running migrate-domain.py ---"
          python3 -u scripts/migrate-domain.py 2>&1
          EXIT_CODE=$?
          echo "--- Exit code: $EXIT_CODE ---"
          exit $EXIT_CODE

      - name: Verify
        run: |
          set +e
          echo "=== rrxs.xyz ==="
          curl -sI "https://rrxs.xyz/" | head -3
          echo "=== pages.dev ==="
          curl -sI "https://rrxs-xyz.pages.dev/" | head -3
