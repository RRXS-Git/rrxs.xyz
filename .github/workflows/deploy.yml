name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Debug env
        run: |
          echo "Python: $(python3 --version 2>/dev/null || echo NONE)"
          echo "jq: $(jq --version 2>/dev/null || echo NONE)"
          echo "PWD: $(pwd)"
          echo "Has TOKEN: $([ -n "${CF_API_TOKEN}" ] && echo YES || echo NO)"
          echo "Has ACCT: $([ -n "${CF_ACCOUNT_ID}" ] && echo YES || echo NO)"

      - name: Ensure production_branch=main
        run: |
          set +e
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz" | \
            python3 -c "import sys,json; d=json.load(sys.stdin); print(f'success={d.get(\"success\")}')"

      - name: Deploy to rrxs-xyz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Migrate custom domain rrxs.xyz
        run: bash scripts/migrate-domain.sh

      - name: Verify
        run: |
          echo "=== rrxs.xyz ==="
          curl -sI "https://rrxs.xyz/" | head -5
          echo ""
          echo "=== pages.dev ==="
          curl -sI "https://rrxs-xyz.pages.dev/" | head -5
          echo ""
          echo "=== Body size ==="
          echo "rrxs.xyz: $(curl -s 'https://rrxs.xyz/' | wc -c) bytes"
          echo "pages.dev: $(curl -s 'https://rrxs-xyz.pages.dev/' | wc -c) bytes"
          echo ""
          echo "=== rrxs.xyz title ==="
          curl -s 'https://rrxs.xyz/' | grep -o '<title>[^<]*</title>' || echo "NONE"
          echo "pages.dev title:"
          curl -s 'https://rrxs-xyz.pages.dev/' | grep -o '<title>[^<]*</title>' || echo "NONE"