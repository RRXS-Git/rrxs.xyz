name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Deploy via wrangler
        uses: cloudflare/wrangler-action@v3
        id: wrangler
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Promote to production via API
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          API="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz"
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"
          CT="Content-Type: application/json"

          echo "::group::1. Ensure production_branch=main"
          PROJECT=$(curl -s -H "$AUTH" "$API")
          CURRENT_BRANCH=$(echo "$PROJECT" | jq -r '.result.deployment_configs.production_branch // "none"')
          echo "Current production_branch: $CURRENT_BRANCH"
          if [ "$CURRENT_BRANCH" != "main" ]; then
            echo "Setting production_branch to main..."
            RESULT=$(curl -s -X PATCH -H "$AUTH" -H "$CT" -d '{"deployment_configs":{"production_branch":"main"}}' "$API")
            echo "$RESULT" | jq -c '{success: .success}'
          else
            echo "Already main - skipping PATCH"
          fi
          echo "::endgroup::"

          echo "::group::2. Show final project state"
          curl -s -H "$AUTH" "$API" | jq '{production_branch: .result.deployment_configs.production_branch, canonical_id: .result.canonical_deployment.id, canonical_url: .result.canonical_deployment.url, canonical_created: .result.canonical_deployment.created_on}'
          echo "::endgroup::"
