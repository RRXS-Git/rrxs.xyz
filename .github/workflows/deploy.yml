name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Debug env
        run: |
          echo "Python: $(python3 --version 2>/dev/null || echo NONE)"
          echo "jq: $(jq --version 2>/dev/null || echo NONE)"
          echo "PWD: $(pwd)"
          echo "Has TOKEN: $([ -n \"${CF_API_TOKEN}\" ] && echo YES || echo NO)"
          echo "Has ACCT: $([ -n \"${CF_ACCOUNT_ID}\" ] && echo YES || echo NO)"

      - name: Ensure production_branch=main
        run: |
          set +e
          curl -s -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz" | \
            jq -c '{success, errors}'

      - name: Deploy to rrxs-xyz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Migrate custom domain rrxs.xyz
        run: bash scripts/migrate-domain.sh

      - name: Diagnose domain routing
        run: |
          set +e
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"
          ACCT="${CF_ACCOUNT_ID}"
          BASE="https://api.cloudflare.com/client/v4/accounts/${ACCT}/pages/projects"
          OUT=/tmp/diagnose.txt

          echo "=== All Pages projects ===" | tee "$OUT"
          curl -s -H "$AUTH" "${BASE}?per_page=20" | jq -r '.result[] | "\(.name) — subdomain: \(.subdomain)"' | tee -a "$OUT"

          echo "" | tee -a "$OUT"
          echo "=== Domains on each project ===" | tee -a "$OUT"
          for PROJ in $(curl -s -H "$AUTH" "${BASE}?per_page=20" | jq -r '.result[].name'); do
            DOMS=$(curl -s -H "$AUTH" "${BASE}/${PROJ}/domains")
            echo "--- $PROJ ---" | tee -a "$OUT"
            echo "$DOMS" | jq -r '.result[] | "  \(.name) (status: \(.status))"' | tee -a "$OUT" 2>/dev/null || echo "  (no domains)" | tee -a "$OUT"
          done

          echo "" | tee -a "$OUT"
          echo "=== Zone info ===" | tee -a "$OUT"
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/zones?name=rrxs.xyz" | jq '{success: .success, result: [.result[] | {name, id, status}]}' | tee -a "$OUT"

          echo "" | tee -a "$OUT"
          echo "=== Content comparison ===" | tee -a "$OUT"
          curl -sI "https://rrxs.xyz/" | head -5 | tee -a "$OUT"
          echo "rrxs.xyz size: $(curl -s 'https://rrxs.xyz/' | wc -c)" | tee -a "$OUT"
          curl -sI "https://rrxs-xyz.pages.dev/" | head -5 | tee -a "$OUT"
          echo "pages.dev size: $(curl -s 'https://rrxs-xyz.pages.dev/' | wc -c)" | tee -a "$OUT"

          cp "$OUT" diagnose.txt

      - name: Upload diagnose artifact
        uses: actions/upload-artifact@v4
        with:
          name: domain-diagnose
          path: diagnose.txt

      - name: Verify
        run: |
          set +e
          echo "=== rrxs.xyz ==="
          curl -sI "https://rrxs.xyz/" | head -3
          echo ""
          echo "=== pages.dev ==="
          curl -sI "https://rrxs-xyz.pages.dev/" | head -3
          echo ""
          echo "=== Body size compare ==="
          echo "rrxs.xyz: $(curl -s 'https://rrxs.xyz/' | wc -c) bytes"
          echo "pages.dev: $(curl -s 'https://rrxs-xyz.pages.dev/' | wc -c) bytes"
