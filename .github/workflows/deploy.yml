name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Debug env
        run: |
          echo "Python: $(python3 --version 2>/dev/null || echo NONE)"
          echo "jq: $(jq --version 2>/dev/null || echo NONE)"
          echo "PWD: $(pwd)"
          echo "Has TOKEN: $([ -n \"${CF_API_TOKEN}\" ] && echo YES || echo NO)"
          echo "Has ACCT: $([ -n \"${CF_ACCOUNT_ID}\" ] && echo YES || echo NO)"

      - name: Ensure production_branch=main
        run: |
          set +e
          curl -s -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz" | \
            jq -c '{success, errors}'

      - name: Deploy to rrxs-xyz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Migrate custom domain rrxs.xyz (curl only)
        run: |
          set -e
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"
          BASE="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects"
          TARGET="rrxs-xyz"
          DOMAIN="rrxs.xyz"

          echo "=== Step 1: Find which project has rrxs.xyz ==="
          OLD_PROJ=""
          for PROJ in $(curl -s -H "$AUTH" "${BASE}?per_page=50" | jq -r '.result[].name'); do
            RESULT=$(curl -s -H "$AUTH" "${BASE}/${PROJ}/domains")
            FOUND=$(echo "$RESULT" | jq -r --arg d "$DOMAIN" '.result[] | select(.name==$d) | .name')
            echo "$PROJ: $(echo "$RESULT" | jq -c '{success, result_count: (.result | length)}')"
            if [ -n "$FOUND" ]; then
              OLD_PROJ="$PROJ"
              echo "  >>> FOUND $DOMAIN on $PROJ"
            fi
          done
          echo "OLD_PROJ=$OLD_PROJ"

          echo ""
          echo "=== Step 2: Delete from old project ==="
          if [ -n "$OLD_PROJ" ] && [ "$OLD_PROJ" != "$TARGET" ]; then
            echo "Deleting $DOMAIN from $OLD_PROJ..."
            DEL_RESULT=$(curl -s -X DELETE -H "$AUTH" "${BASE}/${OLD_PROJ}/domains/${DOMAIN}")
            echo "DELETE: $DEL_RESULT" | head -5
          elif [ "$OLD_PROJ" = "$TARGET" ]; then
            echo "Already on $TARGET, skipping delete"
          else
            echo "Domain not found on any project, skipping delete"
          fi

          echo ""
          echo "=== Step 3: Add to $TARGET ==="
          if [ "$OLD_PROJ" != "$TARGET" ]; then
            echo "Adding $DOMAIN to $TARGET..."
            ADD_RESULT=$(curl -s -w "\nHTTP_CODE:%{http_code}" -X POST \
              -H "$AUTH" -H "Content-Type: application/json" \
              -d "{\"name\":\"${DOMAIN}\"}" \
              "${BASE}/${TARGET}/domains")
            echo "POST raw output:"
            echo "$ADD_RESULT"
            echo ""
            # Check if the domain was actually added
            sleep 3
            VERIFY=$(curl -s -H "$AUTH" "${BASE}/${TARGET}/domains" | jq -r --arg d "$DOMAIN" '.result[] | select(.name==$d) | .status')
            echo "Domain status after POST: $VERIFY"
          else
            echo "Already on $TARGET, skipping add"
          fi

          echo ""
          echo "=== Step 4: All domains on $TARGET ==="
          curl -s -H "$AUTH" "${BASE}/${TARGET}/domains" | jq -c '.result[] | {name, status}'

          echo ""
          echo "=== DONE ==="

      - name: Verify
        run: |
          set +e
          echo "=== rrxs.xyz ==="
          curl -sI "https://rrxs.xyz/" | head -3
          echo "=== pages.dev ==="
          curl -sI "https://rrxs-xyz.pages.dev/" | head -3
