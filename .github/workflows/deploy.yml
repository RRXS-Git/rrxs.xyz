name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main
      - name: Promote to Production (ensure custom domain alias)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          echo "=== Current project status ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/rrxs-xyz" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            jq '{production_branch: .result.production_branch, canonical_id: .result.canonical_deployment.id, canonical_url: .result.canonical_deployment.url, domains: .result.domains}'
          
          echo ""
          echo "=== Ensure production_branch=main ==="
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/rrxs-xyz" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"production_branch": "main"}' | jq '{success: .success, errors: .errors}'
          
          echo ""
          echo "=== Latest 3 deployments ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/rrxs-xyz/deployments?per_page=3" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            jq '.result[] | {id: .id, created_on: .created_on, status: .latest_stage.status, url: .url, aliases: .aliases}'
          
          echo ""
          echo "=== Attempt to assign rrxs.xyz as alias to latest deployment ==="
          LATEST_ID=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/rrxs-xyz/deployments?per_page=3" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            jq -r '[.result[] | select(.latest_stage.status == "success")] | sort_by(.created_on) | reverse | .[0].id')
          echo "Latest successful deployment: $LATEST_ID"
          if [ -n "$LATEST_ID" ] && [ "$LATEST_ID" != "null" ]; then
            curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/rrxs-xyz/deployments/$LATEST_ID" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"aliases": ["rrxs.xyz"]}' | jq '{success: .success, aliases: .result.aliases}'
          fi
          
          echo ""
          echo "=== Final project status ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/rrxs-xyz" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | \
            jq '{production_branch: .result.production_branch, canonical_id: .result.canonical_deployment.id, canonical_url: .result.canonical_deployment.url, domains: .result.domains}'
