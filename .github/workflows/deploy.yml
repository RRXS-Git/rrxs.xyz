name: Deploy to Cloudflare Pages
on:
  push:
    branches:
      - main

env:
  CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build

      - name: Debug env
        run: |
          echo "Python: $(python3 --version 2>/dev/null || echo NONE)"
          echo "jq: $(jq --version 2>/dev/null || echo NONE)"
          echo "PWD: $(pwd)"
          echo "Has TOKEN: $([ -n \"${CF_API_TOKEN}\" ] && echo YES || echo NO)"
          echo "Has ACCT: $([ -n \"${CF_ACCOUNT_ID}\" ] && echo YES || echo NO)"

      - name: Ensure production_branch=main
        run: |
          set +e
          curl -s -X PATCH \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"production_branch":"main"}' \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/pages/projects/rrxs-xyz" | \
            jq -c '{success, errors}'

      - name: Deploy to rrxs-xyz
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=rrxs-xyz --branch=main

      - name: Migrate custom domain rrxs.xyz
        run: bash scripts/migrate-domain.sh

      - name: Diagnose domain routing
        run: |
          set +e
          AUTH="Authorization: Bearer ${CF_API_TOKEN}"
          ACCT="${CF_ACCOUNT_ID}"
          BASE="https://api.cloudflare.com/client/v4/accounts/${ACCT}/pages/projects"

          echo "## 🌐 Domain Routing Diagnosis" >> "$GITHUB_STEP_SUMMARY"

          echo "### All Pages projects" >> "$GITHUB_STEP_SUMMARY"
          curl -s -H "$AUTH" "${BASE}?per_page=20" | jq -r '.result[] | "* \(.name)"' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Domains on each project" >> "$GITHUB_STEP_SUMMARY"
          for PROJ in $(curl -s -H "$AUTH" "${BASE}?per_page=20" | jq -r '.result[].name'); do
            DOMS=$(curl -s -H "$AUTH" "${BASE}/${PROJ}/domains")
            echo "**$PROJ**: $(echo "$DOMS" | jq -r '.result | length') domain(s)" >> "$GITHUB_STEP_SUMMARY"
            echo "$DOMS" | jq -r '.result[] | "* \(.name) (status: \(.status))"' >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "  (none)" >> "$GITHUB_STEP_SUMMARY"
          done

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Zone info" >> "$GITHUB_STEP_SUMMARY"
          curl -s -H "$AUTH" "https://api.cloudflare.com/client/v4/zones?name=rrxs.xyz" | jq '{success: .success, result: [.result[] | {name, id, status}]}' >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Content comparison (cache-bust)" >> "$GITHUB_STEP_SUMMARY"
          RRXS=$(curl -s "https://rrxs.xyz/?$(date +%s)" | wc -c)
          PDEV=$(curl -s "https://rrxs-xyz.pages.dev/?$(date +%s)" | wc -c)
          echo "rrxs.xyz: $RRXS bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "pages.dev: $PDEV bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "Match: $([ "$RRXS" = "$PDEV" ] && echo 'YES ✅' || echo 'NO ❌')" >> "$GITHUB_STEP_SUMMARY"
          echo "Done"

      - name: Verify
        run: |
          set +e
          echo "=== rrxs.xyz ==="
          curl -sI "https://rrxs.xyz/" | head -3
          echo ""
          echo "=== pages.dev ==="
          curl -sI "https://rrxs-xyz.pages.dev/" | head -3
          echo ""
          echo "=== Body size compare ==="
          echo "rrxs.xyz: $(curl -s 'https://rrxs.xyz/' | wc -c) bytes"
          echo "pages.dev: $(curl -s 'https://rrxs-xyz.pages.dev/' | wc -c) bytes"
